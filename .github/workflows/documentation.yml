name: Build and Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # the version printed in the manual comes from the tags
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements-dev.txt

      - name: Check the version logic
        run: python tools/docs/test_version.py

      - name: Build PDF manual
        run: |
          # Published with the site as /downloads/Stepper-Lab_User_Manual.pdf
          python tools/docs/build_manual.py --output docs/downloads/Stepper-Lab_User_Manual.pdf

      # actions/checkout leaves an HTTPS remote authenticated with GITHUB_TOKEN
      # (contents: write), so gh-deploy can push to gh-pages without a deploy key.
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        run: mkdocs gh-deploy --force --strict
