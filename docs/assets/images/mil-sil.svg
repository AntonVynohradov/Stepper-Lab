<text x="470.0" y="97.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">sstep_xcos.c calls the Stepper-C library</text>
<text x="470.0" y="114.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">FIXED or FLOAT, one per Scilab session</text>
<text x="470.0" y="131.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">compiled once by sil_build()</text>
<rect x="270" y="190" width="400" height="110" rx="10" fill="#E8F0FB" stroke="#1E5AA8" stroke-width="1.5"/>
